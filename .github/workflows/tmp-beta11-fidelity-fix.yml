name: Temporary beta11 fidelity patch
on:
  push:
    branches:
      - beta11-fidelity-fix
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta11-fidelity-fix
      - name: Apply patch
        run: node .tmp/beta11-fidelity-patch.mjs
      - name: Validate patch
        run: |
          node --check src/snapshot.mjs
          node --check src/main-images.mjs
          node tests/snapshot-media-control-smoke.mjs
          node tests/main-image-finalization-smoke.mjs
          node tests/session-state-refresh-smoke.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/snapshot.mjs src/main-images.mjs public/index.html tests/snapshot-media-control-smoke.mjs tests/main-image-finalization-smoke.mjs tests/session-state-refresh-smoke.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'beta11: preserve media controls and refresh session state'
          git push origin HEAD:beta11-fidelity-fix
