name: Release packaged version

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check source
        shell: bash
        run: |
          set -euo pipefail
          for file in server*.mjs src/*.mjs; do
            node --check "$file"
          done
          rm -f /tmp/crawler-inline-*.js
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const htmlFiles = fs.readdirSync('public').filter(name => name.endsWith('.html')).sort();
          let written = 0;
          for (const name of htmlFiles) {
            const html = fs.readFileSync(path.join('public', name), 'utf8');
            const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(match => match[1]);
            if (!scripts.length) continue;
            const safe = name.replace(/[^A-Za-z0-9_.-]/g, '_');
            fs.writeFileSync(`/tmp/crawler-inline-${written}-${safe}.js`, scripts.join('\n'));
            written++;
          }
          if (!written) throw new Error('No inline public scripts found to syntax-check.');
          NODE
          for file in /tmp/crawler-inline-*.js; do
            node --check "$file"
          done

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; leaving it unchanged."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build downloadable ZIP
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="chatgpt-conversation-crawler-v${VERSION}.zip"
          PREFIX="chatgpt-conversation-crawler-v${VERSION}/"
          git archive --format=zip --prefix="$PREFIX" --output="$ARCHIVE" "$GITHUB_SHA"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi
          gh release create "$TAG" "$ARCHIVE#Cross-platform source ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ChatGPT Conversation Crawler v${VERSION}" \
            --generate-notes \
            "${EXTRA_ARGS[@]}"

      - name: Release summary
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          EXISTS: ${{ steps.existing.outputs.exists }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [[ "$EXISTS" == "true" ]]; then
            echo "Release $TAG already existed, so no release was modified." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$PRERELEASE" == "true" ]]; then
            echo "Created prerelease $TAG with a downloadable cross-platform source ZIP." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Created release $TAG with a downloadable cross-platform source ZIP." >> "$GITHUB_STEP_SUMMARY"
          fi
