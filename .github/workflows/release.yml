name: Validate and release packaged version

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node dependencies for runtime tests
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium for browser-backed runtime tests
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Syntax-check source
        shell: bash
        run: |
          set -euo pipefail
          for file in server*.mjs src/*.mjs tests/*.mjs; do
            node --check "$file"
          done

          rm -f /tmp/crawler-inline-*.js
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const htmlFiles = fs.readdirSync('public').filter(name => name.endsWith('.html')).sort();
          let written = 0;
          for (const name of htmlFiles) {
            const html = fs.readFileSync(path.join('public', name), 'utf8');
            const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(match => match[1]);
            if (!scripts.length) continue;
            const safe = name.replace(/[^A-Za-z0-9_.-]/g, '_');
            fs.writeFileSync(`/tmp/crawler-inline-${written}-${safe}.js`, scripts.join('\n'));
            written++;
          }
          if (!written) throw new Error('No inline public scripts found to syntax-check.');
          NODE

          for file in /tmp/crawler-inline-*.js; do node --check "$file"; done

      - name: Run runtime smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.mjs; do
            echo "Running $test_file"
            node "$test_file"
          done

  diagnostic_artifact:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated PR tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build diagnostic ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" != *-dev* ]]; then
            echo "Refusing to build PR diagnostic artifact for non-dev version: $VERSION" >&2
            exit 1
          fi
          ARCHIVE="chatgpt-conversation-crawler-v${VERSION}.zip"
          PREFIX="chatgpt-conversation-crawler-v${VERSION}/"
          git archive --format=zip --prefix="$PREFIX" --output="$ARCHIVE" "$GITHUB_SHA"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          sha256sum "$ARCHIVE"

      - name: Upload validated diagnostic ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dev-diagnostic-package
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build downloadable ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="chatgpt-conversation-crawler-v${VERSION}.zip"
          PREFIX="chatgpt-conversation-crawler-v${VERSION}/"
          git archive --format=zip --prefix="$PREFIX" --output="$ARCHIVE" "$GITHUB_SHA"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          sha256sum "$ARCHIVE"

      - name: Replace existing release if necessary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Replacing existing mutable release $TAG."
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          elif git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Removing stale local/remote tag $TAG before release recreation."
            git push origin ":refs/tags/$TAG" || true
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [[ "$PRERELEASE" == "true" ]]; then EXTRA_ARGS+=(--prerelease); fi
          gh release create "$TAG" "$ARCHIVE#Cross-platform source ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ChatGPT Conversation Crawler v${VERSION}" \
            --generate-notes \
            "${EXTRA_ARGS[@]}"

      - name: Release summary
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "Created/replaced prerelease $TAG at $GITHUB_SHA with a downloadable cross-platform source ZIP." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Created/replaced release $TAG at $GITHUB_SHA with a downloadable cross-platform source ZIP." >> "$GITHUB_STEP_SUMMARY"
          fi
